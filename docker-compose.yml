services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: uno_arena
      MYSQL_USER: uno
      MYSQL_PASSWORD: ${DATABASE_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uuno", "-p${DATABASE_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:mysql://mysql:3306/uno_arena?useSSL=false&allowPublicKeyRetrieval=true
      DATABASE_USERNAME: uno
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:5173}
      OTP_DEV_MODE: ${OTP_DEV_MODE:-false}
      MAIL_HOST: ${MAIL_HOST:-localhost}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-true}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
  frontend:
    build: .
    depends_on:
      - backend
    ports:
      - "5173:80"
volumes:
  mysql_data:

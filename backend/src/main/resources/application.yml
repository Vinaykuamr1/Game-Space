server:
  port: ${PORT:8080}
spring:
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:true}
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/uno_arena?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DATABASE_USERNAME:uno}
    password: ${DATABASE_PASSWORD:uno_local_password}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties.hibernate.jdbc.time_zone: UTC
  jackson:
    default-property-inclusion: non_null
app:
  mail:
    from: ${MAIL_FROM:}
  jwt:
    secret: ${JWT_SECRET:local-only-secret-change-this-to-a-random-32-byte-minimum-secret}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${FRONTEND_ORIGINS:http://localhost:5173}
  auth:
    dev-otp: ${OTP_DEV_MODE:false}
logging:
  level:
    com.unoarena: INFO
